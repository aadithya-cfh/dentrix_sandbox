<!DOCTYPE html>
<html>
<head>
    <title>Confido Health - System Architecture</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 750" width="1050" height="750">
        <!-- Background -->
        <rect width="1050" height="750" fill="#ffffff"/>

        <!-- Title -->
        <text x="680" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333">Data Flow Pattern:</text>

        <!-- Write flow explanation -->
        <rect x="680" y="50" width="320" height="55" rx="4" fill="#fff3e0" stroke="#f59e0b" stroke-width="1"/>
        <text x="695" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">WRITE:</text>
        <text x="695" y="88" font-family="Arial, sans-serif" font-size="11" fill="#666666">App → Postgres → EHR-Connector → Dentrix</text>
        <text x="695" y="100" font-family="Arial, sans-serif" font-size="10" fill="#999999">(Data stored in Postgres first, then synced to EHR)</text>

        <!-- Read flow explanation -->
        <rect x="680" y="115" width="320" height="55" rx="4" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1"/>
        <text x="695" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">READ:</text>
        <text x="695" y="153" font-family="Arial, sans-serif" font-size="11" fill="#666666">App reads directly from Postgres</text>
        <text x="695" y="165" font-family="Arial, sans-serif" font-size="10" fill="#999999">(Daily cron syncs latest EHR data to Postgres)</text>

        <!-- ========== DENTRIX EHR (Top) ========== -->
        <rect x="200" y="50" width="160" height="55" rx="4" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="280" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">Dentrix</text>
        <text x="280" y="93" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">EHR</text>

        <!-- Bidirectional Arrow from Dentrix to EHR-Connector -->
        <line x1="260" y1="105" x2="260" y2="155" stroke="#f59e0b" stroke-width="2"/>
        <line x1="300" y1="105" x2="300" y2="155" stroke="#1a73e8" stroke-width="2"/>
        <polygon points="255,110 260,98 265,110" fill="#f59e0b"/>
        <polygon points="295,150 300,162 305,150" fill="#1a73e8"/>

        <!-- Labels for arrows -->
        <text x="230" y="130" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b">Write</text>
        <text x="310" y="130" font-family="Arial, sans-serif" font-size="9" fill="#1a73e8">Sync</text>

        <!-- ========== EHR-Connector ========== -->
        <rect x="180" y="160" width="200" height="70" rx="4" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="280" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">EHR-Connector</text>
        <text x="280" y="210" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">(Dentrix API)</text>
        <text x="280" y="225" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">OAuth 2.0</text>

        <!-- ========== Daily Sync / Cron Icon ========== -->
        <rect x="400" y="175" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1"/>
        <text x="450" y="193" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a73e8" text-anchor="middle">Daily Sync</text>
        <text x="450" y="207" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">(Cron Job)</text>

        <!-- Arrow from EHR-Connector to Daily Sync -->
        <line x1="380" y1="195" x2="400" y2="195" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="4,2"/>

        <!-- ========== Sync Icon (Circle with arrows) ========== -->
        <circle cx="280" cy="290" r="22" fill="#1a73e8" stroke="none"/>
        <path d="M268,285 Q280,275 292,285" fill="none" stroke="#ffffff" stroke-width="2"/>
        <polygon points="290,282 295,288 288,288" fill="#ffffff"/>
        <path d="M292,295 Q280,305 268,295" fill="none" stroke="#ffffff" stroke-width="2"/>
        <polygon points="270,298 265,292 272,292" fill="#ffffff"/>

        <!-- Arrow from EHR-Connector to Sync -->
        <line x1="280" y1="230" x2="280" y2="268" stroke="#333333" stroke-width="1.5"/>

        <!-- ========== Appointment-Manager ========== -->
        <rect x="160" y="350" width="240" height="80" rx="4" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="280" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Appointment-Manager</text>
        <text x="280" y="400" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">(Confido)</text>
        <text x="280" y="418" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">CRUD</text>

        <!-- Bidirectional dots on Appointment-Manager -->
        <circle cx="160" cy="370" r="5" fill="#1a73e8"/>
        <circle cx="160" cy="390" r="5" fill="#f59e0b"/>
        <circle cx="160" cy="410" r="5" fill="#1a73e8"/>
        <circle cx="400" cy="390" r="5" fill="#1a73e8"/>

        <!-- Arrow from Sync to Appointment-Manager -->
        <line x1="280" y1="312" x2="280" y2="350" stroke="#333333" stroke-width="1.5"/>

        <!-- ========== Postgres Database ========== -->
        <!-- Database cylinder shape -->
        <ellipse cx="550" cy="375" rx="55" ry="18" fill="#e8f5e9" stroke="#333333" stroke-width="1.5"/>
        <path d="M495,375 L495,420 Q550,455 605,420 L605,375" fill="#e8f5e9" stroke="#333333" stroke-width="1.5"/>
        <ellipse cx="550" cy="420" rx="55" ry="18" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="550" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Postgres</text>
        <text x="550" y="412" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">(Supabase)</text>
        <text x="550" y="450" font-family="Arial, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">Source of Truth</text>

        <!-- WRITE Arrow: Appointment-Manager to Postgres (Orange) -->
        <line x1="400" y1="380" x2="490" y2="380" stroke="#f59e0b" stroke-width="2"/>
        <polygon points="485,375 497,380 485,385" fill="#f59e0b"/>
        <text x="445" y="372" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b">Write</text>

        <!-- READ Arrow: Postgres to Appointment-Manager (Blue) -->
        <line x1="490" y1="400" x2="400" y2="400" stroke="#1a73e8" stroke-width="2"/>
        <polygon points="405,395 393,400 405,405" fill="#1a73e8"/>
        <text x="445" y="415" font-family="Arial, sans-serif" font-size="9" fill="#1a73e8">Read</text>

        <!-- Sync arrow from Postgres up to EHR-Connector area -->
        <path d="M605,390 Q650,390 650,250 Q650,195 500,195" fill="none" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="5,3"/>
        <text x="660" y="300" font-family="Arial, sans-serif" font-size="9" fill="#1a73e8" transform="rotate(-90, 660, 300)">Daily Sync</text>

        <!-- Write arrow from Postgres up to EHR -->
        <path d="M495,380 Q430,380 430,250 Q430,195 380,195" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <polygon points="385,190 373,195 385,200" fill="#f59e0b"/>
        <text x="415" y="290" font-family="Arial, sans-serif" font-size="9" fill="#f59e0b" transform="rotate(-90, 415, 290)">Write to EHR</text>

        <!-- ========== Free-Slots Note ========== -->
        <text x="495" y="480" font-family="Arial, sans-serif" font-size="10" fill="#666666">Free-Slots = Availability - Unavailability - Blocked - Appointments</text>

        <!-- ========== Retell Agents (Oval) ========== -->
        <ellipse cx="280" cy="530" rx="110" ry="45" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="280" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Retell Agents</text>
        <text x="280" y="545" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">(Voice AI)</text>

        <!-- Arrow from Appointment-Manager to Retell -->
        <line x1="280" y1="430" x2="280" y2="485" stroke="#333333" stroke-width="1.5"/>
        <polygon points="275,480 280,492 285,480" fill="#333333"/>

        <!-- ========== OUTBOUND (Left) ========== -->
        <polygon points="50,480 90,455 130,480 130,530 90,555 50,530" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="90" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Outbound</text>

        <!-- Bidirectional arrow from Outbound to Retell -->
        <line x1="130" y1="505" x2="170" y2="520" stroke="#333333" stroke-width="1.5"/>
        <polygon points="165,515 177,520 165,525" fill="#333333"/>

        <!-- ========== INBOUND (Right) ========== -->
        <polygon points="430,480 470,455 510,480 510,530 470,555 430,530" fill="none" stroke="#333333" stroke-width="1.5"/>
        <text x="470" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Inbound</text>

        <!-- Bidirectional arrow from Inbound to Retell -->
        <line x1="430" y1="505" x2="390" y2="520" stroke="#333333" stroke-width="1.5"/>
        <polygon points="395,515 383,520 395,525" fill="#333333"/>

        <!-- ========== EventType Defaults Note ========== -->
        <rect x="560" y="500" width="180" height="80" rx="4" fill="#f5f5f5" stroke="#dddddd" stroke-width="1"/>
        <text x="575" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333333">EventType defaults:</text>
        <text x="575" y="540" font-family="Arial, sans-serif" font-size="10" fill="#666666">- list of operatoryIds</text>
        <text x="575" y="555" font-family="Arial, sans-serif" font-size="10" fill="#666666">- duration</text>
        <text x="575" y="570" font-family="Arial, sans-serif" font-size="10" fill="#666666">- offsetStart</text>

        <!-- ========== Legend/Footer ========== -->
        <rect x="30" y="620" width="990" height="110" rx="4" fill="#f5f5f5" stroke="#dddddd" stroke-width="1"/>

        <text x="50" y="645" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333">Data Flow Legend:</text>

        <!-- Write flow -->
        <line x1="50" y1="670" x2="100" y2="670" stroke="#f59e0b" stroke-width="2"/>
        <polygon points="95,665 107,670 95,675" fill="#f59e0b"/>
        <text x="115" y="674" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">WRITE</text>
        <text x="165" y="674" font-family="Arial, sans-serif" font-size="10" fill="#666666">App → Postgres → EHR (Create/Update Patients & Appointments)</text>

        <!-- Read flow -->
        <line x1="50" y1="695" x2="100" y2="695" stroke="#1a73e8" stroke-width="2"/>
        <polygon points="95,690 107,695 95,700" fill="#1a73e8"/>
        <text x="115" y="699" font-family="Arial, sans-serif" font-size="11" fill="#1a73e8" font-weight="bold">READ</text>
        <text x="160" y="699" font-family="Arial, sans-serif" font-size="10" fill="#666666">App reads from Postgres (Patients, Appointments, Providers, Operatories)</text>

        <!-- Sync flow -->
        <line x1="550" y1="670" x2="600" y2="670" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="5,3"/>
        <text x="615" y="674" font-family="Arial, sans-serif" font-size="11" fill="#1a73e8" font-weight="bold">SYNC</text>
        <text x="655" y="674" font-family="Arial, sans-serif" font-size="10" fill="#666666">Daily cron job syncs EHR → Postgres</text>

        <!-- Sync icon -->
        <circle cx="570" cy="695" r="10" fill="#1a73e8"/>
        <text x="570" y="699" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">↻</text>
        <text x="590" y="699" font-family="Arial, sans-serif" font-size="10" fill="#666666">Incremental sync with cursor tracking</text>
    </svg>
</body>
</html>
