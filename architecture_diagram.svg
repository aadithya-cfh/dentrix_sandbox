<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <!-- Background -->
  <rect width="1200" height="700" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">System Architecture</text>

  <!-- Subtitle -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="14" fill="#888888">Confido Health - Dentrix Integration</text>

  <!-- Row 1: Patient Call -->
  <rect x="60" y="140" width="200" height="100" rx="8" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="160" y="180" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Patient Call</text>
  <text x="160" y="205" font-family="monospace" font-size="14" fill="#aaaaaa" text-anchor="middle">(Inbound/Outbound)</text>

  <!-- Arrow 1: Patient Call <-> Confido AI (bidirectional) -->
  <line x1="260" y1="175" x2="340" y2="175" stroke="#4a90d9" stroke-width="2"/>
  <line x1="260" y1="195" x2="340" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="340,170 355,175 340,180" fill="#4a90d9"/>
  <polygon points="260,190 245,195 260,200" fill="#4a90d9"/>

  <!-- Row 1: Confido AI Voice Agent -->
  <rect x="360" y="140" width="220" height="100" rx="8" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="470" y="175" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Confido AI</text>
  <text x="470" y="200" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Voice Agent</text>
  <text x="470" y="225" font-family="monospace" font-size="14" fill="#aaaaaa" text-anchor="middle">(Retell AI)</text>

  <!-- Arrow 2: Confido AI <-> Appointment Manager (bidirectional) -->
  <line x1="580" y1="175" x2="660" y2="175" stroke="#4a90d9" stroke-width="2"/>
  <line x1="580" y1="195" x2="660" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="660,170 675,175 660,180" fill="#4a90d9"/>
  <polygon points="580,190 565,195 580,200" fill="#4a90d9"/>

  <!-- Row 1: Confido Appointment Manager -->
  <rect x="680" y="140" width="240" height="100" rx="8" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="800" y="175" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Confido Appointment</text>
  <text x="800" y="200" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Manager</text>
  <text x="800" y="225" font-family="monospace" font-size="14" fill="#aaaaaa" text-anchor="middle">(Business Logic)</text>

  <!-- Arrow 3: Appointment Manager <-> PostgreSQL (bidirectional vertical) -->
  <line x1="785" y1="240" x2="785" y2="320" stroke="#22c55e" stroke-width="2"/>
  <line x1="815" y1="240" x2="815" y2="320" stroke="#22c55e" stroke-width="2"/>
  <polygon points="780,320 785,335 790,320" fill="#22c55e"/>
  <polygon points="810,240 815,225 820,240" fill="#22c55e"/>
  <text x="850" y="285" font-family="monospace" font-size="12" fill="#22c55e">Read/Write</text>

  <!-- Row 2: PostgreSQL Database -->
  <rect x="680" y="340" width="240" height="100" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="380" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
  <text x="800" y="405" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Database</text>
  <text x="800" y="430" font-family="monospace" font-size="14" fill="#aaaaaa" text-anchor="middle">(Supabase)</text>

  <!-- Arrow 4: Appointment Manager <-> Dentrix Connector (bidirectional) -->
  <line x1="680" y1="375" x2="600" y2="375" stroke="#f59e0b" stroke-width="2"/>
  <line x1="680" y1="395" x2="600" y2="395" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="600,370 585,375 600,380" fill="#f59e0b"/>
  <polygon points="680,390 695,395 680,400" fill="#f59e0b"/>

  <!-- Row 2: Dentrix API Connector -->
  <rect x="360" y="340" width="220" height="100" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="470" y="380" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Dentrix API</text>
  <text x="470" y="405" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Connector</text>
  <text x="470" y="430" font-family="monospace" font-size="14" fill="#aaaaaa" text-anchor="middle">(OAuth 2.0)</text>

  <!-- Arrow 5: Dentrix Connector <-> Dentrix EHR (bidirectional) -->
  <line x1="360" y1="375" x2="280" y2="375" stroke="#ef4444" stroke-width="2"/>
  <line x1="360" y1="395" x2="280" y2="395" stroke="#ef4444" stroke-width="2"/>
  <polygon points="280,370 265,375 280,380" fill="#ef4444"/>
  <polygon points="360,390 375,395 360,400" fill="#ef4444"/>

  <!-- Row 2: Dentrix EHR -->
  <rect x="60" y="340" width="200" height="100" rx="8" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="385" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">Dentrix</text>
  <text x="160" y="410" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle">EHR</text>

  <!-- Vertical connector: Appointment Manager to Connector -->
  <line x1="470" y1="240" x2="470" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Legend -->
  <rect x="60" y="520" width="500" height="140" rx="8" fill="#252540" stroke="#444" stroke-width="1"/>
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Data Flow Legend</text>

  <!-- Legend items -->
  <line x1="80" y1="580" x2="130" y2="580" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="130,575 145,580 130,585" fill="#4a90d9"/>
  <text x="160" y="585" font-family="monospace" font-size="14" fill="#aaaaaa">Voice/Call Flow</text>

  <line x1="80" y1="610" x2="130" y2="610" stroke="#22c55e" stroke-width="2"/>
  <polygon points="130,605 145,610 130,615" fill="#22c55e"/>
  <text x="160" y="615" font-family="monospace" font-size="14" fill="#aaaaaa">Internal Data Sync</text>

  <line x1="80" y1="640" x2="130" y2="640" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="130,635 145,640 130,645" fill="#f59e0b"/>
  <text x="160" y="645" font-family="monospace" font-size="14" fill="#aaaaaa">Database Operations</text>

  <line x1="320" y1="580" x2="370" y2="580" stroke="#ef4444" stroke-width="2"/>
  <polygon points="370,575 385,580 370,585" fill="#ef4444"/>
  <text x="400" y="585" font-family="monospace" font-size="14" fill="#aaaaaa">EHR API Calls</text>

  <!-- Operations labels -->
  <rect x="680" y="520" width="460" height="140" rx="8" fill="#252540" stroke="#444" stroke-width="1"/>
  <text x="700" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Bidirectional Operations</text>

  <text x="700" y="585" font-family="monospace" font-size="13" fill="#22c55e">READ:</text>
  <text x="760" y="585" font-family="monospace" font-size="13" fill="#aaaaaa">Patients, Appointments, Providers</text>

  <text x="700" y="615" font-family="monospace" font-size="13" fill="#f59e0b">WRITE:</text>
  <text x="770" y="615" font-family="monospace" font-size="13" fill="#aaaaaa">Create/Update Patients &amp; Appointments</text>

  <text x="700" y="645" font-family="monospace" font-size="13" fill="#4a90d9">SYNC:</text>
  <text x="760" y="645" font-family="monospace" font-size="13" fill="#aaaaaa">Incremental sync with cursor tracking</text>
</svg>
